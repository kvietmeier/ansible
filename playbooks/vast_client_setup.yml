###===================================================================================###
# Top-Level Playbook for VAST NFS Client Installation & Identity Scaling (10 Users)
#   
# Features: Tagged Execution Vectors, Sudo Management, Custom Environment Injection
# Created By: Karl Vietmeier
# Modified To: Use a variable for the default user password
###===================================================================================###
- name: Install VAST NFS driver and SpecFS Benchmark
  hosts: clients
  become: yes
  
  # --- VARIABLES SECTION ---
  vars:
    default_lab_password: 'Ge2Sb2Te5'
    num_user: '10'
  # --- END VARIABLES SECTION ---


  pre_tasks:
    #---------------------------------------------------------------------------------
    # 0. BASE OS PACKAGE 
    #---------------------------------------------------------------------------------
    - name: Ensure baseline system utilities and client binaries are installed
      ansible.builtin.apt:
        name:
          - nfs-common     
          - rpcbind        
        state: present
        update_cache: yes   
      tags: [ 'packages', 'setup_env' ]
    
    #---------------------------------------------------------------------------------
    # 1. USER CREATION
    #---------------------------------------------------------------------------------
    - name: Ensure labusers 01 through 10 exist with default password
      ansible.builtin.user:
        name: "labuser{{ item }}"
        state: present
        shell: /bin/bash
        create_home: yes
        password: "{{ default_lab_password | password_hash('sha512') }}"
      with_sequence: start=1 end=10 format=%02d
      tags: [ 'provision_users', 'setup_env' ]

    #---------------------------------------------------------------------------------
    # 2. DIRECTORY PROVISIONING VECTOR (UPDATED)
    #---------------------------------------------------------------------------------
    - name: Remove old VAST labuser mount directories (1-10)
      ansible.builtin.file:
        path: "/mount/vast/labuser{{ item }}"
        state: absent
      with_sequence: start=1 end=10 format=%02d
      tags: [ 'mounts', 'setup_env', 'cleanup' ]

    - name: Ensure single VAST gns-dst mount directory exists with 777 permissions
      ansible.builtin.file:
        path: "/mount/vast/gns-dst"
        state: directory
        mode: '0777'
      tags: [ 'mounts', 'setup_env' ]

    #---------------------------------------------------------------------------------
    # 3. USER PRIVILEGE ESCALATION BLOCK
    #---------------------------------------------------------------------------------
    - name: Configure passwordless sudo entry for labuser01 through labuser10
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/labusers"
        create: yes
        owner: root
        group: root
        mode: '0440'
        line: "labuser{{ item }} ALL=(ALL) NOPASSWD:ALL"
        validate: '/usr/sbin/visudo -cf %s'
      with_sequence: start=1 end=10 format=%02d
      tags: [ 'sudo', 'setup_env' ]

    #---------------------------------------------------------------------------------
    # 4. USER RUNTIME ENVIRONMENT STACK (.dircolors distribution)
    #---------------------------------------------------------------------------------
    - name: Copy .dircolors to base labuser home directory
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/env/dircolors"
        dest: /home/labuser/.dircolors
        owner: labuser
        group: labuser
        mode: '0644'
      tags: [ 'env_files', 'setup_env' ]

    - name: Copy .dircolors to labuser01 through labuser10 home directories
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/env/dircolors"
        dest: "/home/labuser{{ item }}/.dircolors"
        owner: "labuser{{ item }}"
        group: "labuser{{ item }}"
        mode: '0644'
      with_sequence: start=1 end=10 format=%02d
      tags: [ 'env_files', 'setup_env' ]

    #---------------------------------------------------------------------------------
    # 5. CORE BASH startup CONFIGURATION (.bashrc distribution)
    #---------------------------------------------------------------------------------
    - name: Copy bashrc template to base labuser profile backing up original
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/bashrc_ubuntu_cloud.sh"
        dest: /home/labuser/.bashrc
        backup: yes
        owner: labuser
        group: labuser
        mode: '0644'
      tags: [ 'bashrc', 'setup_env' ]

    - name: Copy bashrc template to labuser01 through labuser10 profiles backing up originals
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/bashrc_ubuntu_cloud.sh"
        dest: "/home/labuser{{ item }}/.bashrc"
        backup: yes
        owner: "labuser{{ item }}"
        group: "labuser{{ item }}"
        mode: '0644'
      with_sequence: start=1 end=10 format=%02d
      tags: [ 'bashrc', 'setup_env' ]

    #---------------------------------------------------------------------------------
    # 6. SSH SECURITY KEY DISTRIBUTION
    #---------------------------------------------------------------------------------
    - name: Ensure secure .ssh directory exists for all 10 labusers
      ansible.builtin.file:
        path: "/home/labuser{{ item }}/.ssh"
        state: directory
        owner: "labuser{{ item }}"
        group: "labuser{{ item }}"
        mode: '0700'
      with_sequence: start=1 end=10 format=%02d
      tags: [ 'ssh_keys', 'setup_env' ]

    - name: Copy authorized_keys from base labuser to all 10 labuser profiles
      ansible.builtin.copy:
        src: /home/labuser/.ssh/authorized_keys
        dest: "/home/labuser{{ item }}/.ssh/authorized_keys"
        remote_src: yes
        owner: "labuser{{ item }}"
        group: "labuser{{ item }}"
        mode: '0600'
      with_sequence: start=1 end=10 format=%02d
      tags: [ 'ssh_keys', 'setup_env' ]

    #---------------------------------------------------------------------------------
    # 7. SSH DAEMON CONFIGURATION - Allow Password and SSH 
    #---------------------------------------------------------------------------------
    - name: Ensure Password Authentication is enabled in main sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      tags: [ 'sshd_config', 'setup_env' ]

    - name: Override cloud-init SSH restrictions with high-priority drop-in file
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-allow-passwords.conf
        content: |
          # Ansible managed: Override cloud-init default to allow labuser passwords
          PasswordAuthentication yes
        owner: root
        group: root
        mode: '0644'
      register: sshd_dropin_update
      tags: [ 'sshd_config', 'setup_env' ]

    - name: Restart SSH service to apply changes
      ansible.builtin.service:
        name: ssh
        state: restarted
      when: sshd_dropin_update.changed
      tags: [ 'sshd_config', 'setup_env' ]


  roles:
    # - { role: vast_nfs, tags: ['drivers'] }
    # - { role: vast, tags: ['vast_core'] }
    # - { role: specsfs, tags: ['benchmarks'] }