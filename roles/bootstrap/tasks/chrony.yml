# =============================================================================
# tasks/chrony.yml — cloud-aware chrony (AWS / Azure / GCP / OCI)
# Tags: [bootstrap, chrony]
# =============================================================================
---
- name: Ensure chrony package is installed (Ubuntu/Debian)
  ansible.builtin.apt:
    name: chrony
    state: present
  when: is_ubuntu or is_debian

- name: Ensure chrony package is installed (RedHat)
  ansible.builtin.dnf:
    name: chrony
    state: present
  when: is_redhat

- name: Ensure chrony config directory exists (Debian/Ubuntu)
  ansible.builtin.file:
    path: /etc/chrony
    state: directory
    mode: "0755"
  when: is_ubuntu or is_debian

- name: Probe cloud metadata for NTP server
  ansible.builtin.shell: |
    set +e
    if curl -s --connect-timeout 1 -H "Metadata-Flavor: Google" \
        http://169.254.169.254/computeMetadata/v1/ >/dev/null 2>&1; then
      echo "server metadata.google.internal iburst"
    elif curl -s --connect-timeout 1 -H "Metadata:true" \
        "http://169.254.169.254/metadata/instance?api-version=2021-02-01" >/dev/null 2>&1; then
      echo "server 169.254.169.254 prefer iburst"
    elif curl -s --connect-timeout 1 http://169.254.169.254/opc/v1/instance/ >/dev/null 2>&1; then
      echo "server 169.254.169.254 iburst"
    elif curl -s --connect-timeout 1 http://169.254.169.254/latest/meta-data/ >/dev/null 2>&1; then
      echo "server 169.254.169.123 prefer iburst"
    else
      echo "pool pool.ntp.org iburst"
    fi
  args:
    executable: /bin/bash
  register: bootstrap_chrony_probe
  changed_when: false

- name: Set chrony server line fact
  ansible.builtin.set_fact:
    bootstrap_chrony_server_line: "{{ bootstrap_chrony_probe.stdout | trim }}"

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ bootstrap_chrony_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony service
  ansible.builtin.systemd:
    name: "{{ bootstrap_chrony_service }}"
    state: started
    enabled: true
  failed_when: false
