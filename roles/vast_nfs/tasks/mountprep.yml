---
# =============================================================================
# mountprep.yml – Prepare mount point and save mount command
#
# Description:
#   Creates NFS mount point directory and writes a ready-to-run mount command
#   to nfs_mount_cmd.txt for manual or automated use.
#
# Tags:
#   mountprep  – directory + saved command
#   mount_now  – also executes the mount immediately
# =============================================================================

- name: Ensure NFS mount point exists
  file:
    path: "{{ mount_point }}"
    state: directory
    mode: '0777'

- name: Save NFS mount command to text file
  copy:
    content: |
      sudo mount -t nfs -o proto=tcp,vers=3,nconnect={{ conns }},remoteports={{ port_range }} \
      {{ dns_alias }}.{{ dns_domain }}.org:/{{ view_path }} {{ mount_point }}
    dest: "/home/{{ base_user | default(ansible_user) }}/nfs_mount_cmd.txt"
    owner: "{{ base_user | default(ansible_user) }}"
    group: "{{ base_user | default(ansible_user) }}"
    mode: '0644'

- name: Execute NFS mount command immediately
  ansible.posix.mount:
    path: "{{ mount_point }}"
    src: "{{ dns_alias }}.{{ dns_domain }}.org:/{{ view_path }}"
    fstype: nfs
    opts: "proto=tcp,vers=3,nconnect={{ conns }},remoteports={{ port_range }}"
    state: mounted
  when: "'mount_now' in ansible_run_tags"
