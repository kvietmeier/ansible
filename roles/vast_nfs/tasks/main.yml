# =============================================================================
---
# main.yml – Master task flow for VAST NFS driver role
#
# Description:
#   Orchestrates prerequisites, download, build, install, and verify for the
#   VAST NFS kernel driver (Debian/Ubuntu and RHEL-family).
#
# Tags (prefer these):
#   install_driver  – full driver path via site.yml (prereqs → verify)
#   mountprep       – create /mount/vast + write nfs_mount_cmd.txt (opt-in)
#   mount_now       – mountprep + execute the mount (opt-in)
#
# Stage tags (re-run after a partial failure; need prior stage outputs):
#   prereqs, disable_upgrades, download, build, install, verify
# =============================================================================

- include_tasks: prereqs.yml
  tags: [prereqs]

- include_tasks: disable_upgrades.yml
  tags: [prereqs, disable_upgrades]
  when: ansible_facts['distribution'] == 'Ubuntu'

- include_tasks: download.yml
  tags: [download]

- include_tasks: build.yml
  tags: [build]

- include_tasks: install.yml
  tags: [install]

- include_tasks: verify.yml
  tags: [verify]

# Opt-in only — skipped on --tags install_driver (role tag inheritance)
- include_tasks: mountprep.yml
  tags: [mountprep, mount_now]
  when: >-
    ('mountprep' in ansible_run_tags) or
    ('mount_now' in ansible_run_tags)
