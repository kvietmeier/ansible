# -------------------------------------------------------------------------
# 10. S3 CLIENT CONFIGURATION
# -------------------------------------------------------------------------
- name: Copy basic S3 configuration to base user profile (.s3cfg)
  ansible.builtin.copy:
    src: s3cfg-basic
    dest: "/home/{{ base_user }}/.s3cfg"
    owner: "{{ base_user }}"
    group: "{{ base_user }}"
    mode: '0600'
  tags: ['s3_config', 'setup_env']

- name: Copy basic S3 configuration to all numbered user profiles
  ansible.builtin.copy:
    src: s3cfg-basic
    dest: "/home/{{ user_prefix }}{{ item }}/.s3cfg"
    owner: "{{ user_prefix }}{{ item }}"
    group: "{{ user_prefix }}{{ item }}"
    mode: '0600'
  with_sequence: start=1 end="{{ num_user }}" format=%02d
  tags: ['s3_config', 'setup_env']

- name: Provide S3 example config file as reference for base user
  ansible.builtin.copy:
    src: s3cfg-example
    dest: "/home/{{ base_user }}/s3cfg-example"
    owner: "{{ base_user }}"
    group: "{{ base_user }}"
    mode: '0644'
  tags: ['s3_config', 'setup_env']

- name: Provide S3 example config file as reference for numbered users
  ansible.builtin.copy:
    src: s3cfg-example
    dest: "/home/{{ user_prefix }}{{ item }}/s3cfg-example"
    owner: "{{ user_prefix }}{{ item }}"
    group: "{{ user_prefix }}{{ item }}"
    mode: '0644'
  with_sequence: start=1 end="{{ num_user }}" format=%02d
  tags: ['s3_config', 'setup_env']

